<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Metadata -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="description" content="Example 1 for HTML & CSS module" />
  <meta name="author" content="Hanna" />

  <title>cs3990 Example 1</title>
  <link rel="icon" type="image/x-icon" href="Favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="stylesheet" href="Styles/styles.css" />
</head>

<body class="brown">
  <div class="grid-container">
    
    <!-- Main Display Box (Image Appears Here) -->
    <div class="box" id="main-display">This is a box</div>

    <!-- Image Selection Box -->
    <div class="box">
      <a href="#img1"><img class="cat" src="Images/cat1.jpg" alt="White and orange cat"></a>
      <a href="#img2"><img src="Images/cat2.jpg" alt=""></a>
      <a href="#img3"><img src="Images/cat3.jpg" alt=""></a>
      <a href="#img4"><img src="Images/cat4.jpg" alt=""></a>
    </div>

    <!-- Footer Box -->
    <div class="box">Midterm - Winter 2025 Chad Norris-White</div>
  </div>

  <!-- Hidden Elements for CSS Targeting -->
  <div id="img1"></div>
  <div id="img2"></div>
  <div id="img3"></div>
  <div id="img4"></div>

</body>
</html>
