<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Grid Templates</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 🌐 Grid Example 1: Basic 3x3 Grid -->
  <h2>1. Basic 3x3 Grid (Named Lines)</h2>
  <div class="grid-basic">
    <div>Top Left</div>
    <div>Top Center</div>
    <div>Top Right</div>
    <div>Middle Left</div>
    <div>Middle Center</div>
    <div>Middle Right</div>
    <div>Bottom Left</div>
    <div>Bottom Center</div>
    <div>Bottom Right</div>
</div>

<!-- 📐 Grid Example 2: Header / Sidebar / Main / Footer -->
<h2>2. Layout Grid (Named Lines)</h2>
<div class="grid-layout">
    <header style="grid-column: start / end; grid-row: header;">Header</header>
    <aside style="grid-column: start / main; grid-row: content;">Sidebar</aside>
    <main style="grid-column: main / end; grid-row: content;">Main Content</main>
    <footer style="grid-column: start / end; grid-row: footer;">Footer</footer>
</div>

<!-- 🧩 Grid Example 3: Named Grid Areas -->
<h2>3. Grid with Named Areas</h2>
<div class="grid-areas">
    <div style="grid-area: header;">Header</div>
    <div style="grid-area: left;">Sidebar Left</div>
    <div style="grid-area: main;">Main</div>
    <div style="grid-area: right;">Sidebar Right</div>
    <div style="grid-area: footer;">Footer</div>
</div>

</body>
</html>
